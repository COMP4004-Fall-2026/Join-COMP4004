name: Invite Member
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue title
        id: check
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if grep -Eiq '^Add .+ to Class$' <<< "$TITLE"; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Invite User to Org
        id: invite
        if: steps.check.outputs.match == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const inviteUrl = `https://github.com/orgs/${context.repo.owner}/invitation`;
            try {
              const { data: user } = await github.rest.users.getByUsername({
                username: context.actor,
              });
              await github.rest.orgs.createInvitation({
                org: context.repo.owner,
                invitee_id: user.id,
              });
              core.setOutput('status', 'invited');
              core.setOutput('message', `Invitation sent! Check your email or go to ${inviteUrl} to accept.`);
            } catch (error) {
              if (error.status === 422) {
                core.setOutput('status', 'already');
                core.setOutput('message', `You already have a pending invitation or are a member. Go to ${inviteUrl} to accept. If you can't find an invite page, refer to this Brightspace Thread: https://brightspace.carleton.ca/d2l/le/473774/discussions/threads/931928/View`);
              } else {
                core.setOutput('status', 'failed');
                core.setOutput('message', `Could not send an invite (HTTP ${error.status ?? 'unknown'}). A maintainer will follow up.`);
                core.setFailed(`Invite failed: ${error.message}`);
              }
            }

      - name: Reply & Close Issue
        if: always() && steps.check.outputs.match == 'true'
        uses: actions/github-script@v9
        env:
          INVITE_STATUS: ${{ steps.invite.outputs.status }}
          INVITE_MESSAGE: ${{ steps.invite.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.INVITE_MESSAGE,
            });
            if (process.env.INVITE_STATUS !== 'failed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }
